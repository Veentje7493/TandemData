name: Post JSON File to Two URLs
on:
push:
branches:
- main # Runs only when pushing to the main branch
workflow_dispatch: # Allows manual trigger
jobs:
post_json:
runs-on: ubuntu-latest
steps:
- name: Checkout Repository
uses: actions/checkout@v3
- name: Send JSON Data to First URL
run: |
curl -X POST "https://:LaWcKd8NSHmULGJMGd-Rww@eu.tandem.autodesk.com/api/v1/timeseries/models/urn:adsk.dtm:MtErAftaSyWTBXyWNpzBMg/streams/AQAAAFd9MtYwg0YwscQrJQUhdWAAAAAA" \
-H "Content-Type: application/json" \
-d @stream.json
- name: Send JSON Data to Second URL
run: |
curl -X POST "https://:wIj6dt5YTDaQoP5Bgmr2bQ@eu.tandem.autodesk.com/api/v1/timeseries/models/urn:adsk.dtm:MtErAftaSyWTBXyWNpzBMg/streams/AQAAAINWvY1PE0UhpMVJFWonW2gAAAAA" \
-H "Content-Type: application/json" \
-d @stream.json
